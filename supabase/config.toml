# Supabase CLI config - used for `supabase functions deploy` etc.
# Run `supabase link --project-ref <your-project-ref>` once to connect this folder
# to the same Supabase project the extension uses.

project_id = "salelinx-web"

# All functions have verify_jwt = false. The Supabase gateway's built-in
# JWT verify only supports HS256, but our project issues ES256 tokens.
# Auth is still enforced: `create-checkout-session`, `create-portal-session`,
# `send-shipping-labels`, `delete-account`, and `admin-change-plan` call
# supabase.auth.getUser() inside the handler and return 401 if null
# (`admin-change-plan` additionally requires admin_users membership).
# `stripe-webhook` is signed by Stripe, not by user JWT.
# `send-auth-email` is signed by Supabase Auth (Standard Webhooks).
# `send-support-email` is gated by a shared secret in the x-support-webhook-secret
# header (set in the Database Webhook config).
# `process-referral-rewards` is gated by a shared secret in the
# x-referral-cron-secret header (set in the dashboard Cron job config).
# `report-telemetry` validates the caller's JWT via getUser() as a spam gate
# only - the identity is discarded and never stored (see 010_endpoint_health.sql).

[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false

[functions.create-portal-session]
verify_jwt = false

[functions.send-auth-email]
verify_jwt = false

[functions.send-support-email]
verify_jwt = false

[functions.send-shipping-labels]
verify_jwt = false

[functions.resolve-category]
verify_jwt = false

[functions.admin-change-plan]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.admin-delete-user]
verify_jwt = false

[functions.process-referral-rewards]
verify_jwt = false

# Public on purpose: returns only the referee coupon's terms (percent/amount,
# duration), never the coupon id. See the function header.
[functions.get-referral-discount]
verify_jwt = false

[functions.report-telemetry]
verify_jwt = false

# `report-selftest` also validates via getUser(), but KEEPS the identity and
# re-checks admin_users with the service role before writing. See the header
# comment in its index.ts for why it cannot gate on is_admin() (AAL2).
[functions.report-selftest]
verify_jwt = false
