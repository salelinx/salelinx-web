<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="640" height="360" fill="#f4f4f5"/>
  <text x="60" y="88" font-size="40" font-weight="700" fill="#18181b">Seller fee: £0</text>
