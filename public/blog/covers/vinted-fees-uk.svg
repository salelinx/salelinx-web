  <rect x="504" y="156" width="76" height="72" rx="8" fill="#ffffff" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="542" y="198" font-size="15" fill="#52525b" text-anchor="middle">postage</text>
